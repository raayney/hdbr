name: basket-dispersion-ml
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy>=1.24.0
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn=1.3.0
